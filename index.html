<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machine à Sous Deluxe</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #1a1a1a, #333);
      color: white; font-family: 'Segoe UI', sans-serif;
    }

    header {
      position: fixed; top: 10px; left: 10px;
      background: #222; border: 2px solid gold;
      border-radius: 12px; padding: 8px 16px;
      font-size: 1.2em; color: gold;
      box-shadow: 0 0 10px gold;
      cursor: pointer; z-index: 1000;
    }
    
    .credit-value {
      display: none; position: fixed;
      top: 60px; left: 10px; background: #333;
      color: #fff; border: 1px solid gold;
      padding: 10px; border-radius: 10px;
      font-size: 1em; z-index: 1000;
    }

    main {
      text-align: center; padding-top: 80px;
      padding-bottom: 60px;
    }

    h1 {
      font-size: 6vw; margin-bottom: 10px;
      color: gold; text-shadow: 2px 2px #000;
    }

    #slots {
      display: flex; justify-content: center;
      gap: 3vw; margin: 20px; flex-wrap: wrap;
    }

    .slot {
      width: 20vw; max-width: 90px;
      height: 20vw; max-height: 90px;
      background: #222; border: 3px solid gold;
      border-radius: 10px; font-size: 2em;
      display: flex; align-items: center;
      justify-content: center; box-shadow: 0 0 10px gold;
    }
    
    .spinning { animation: spin 0.5s infinite; }
    @keyframes spin {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(180deg); }
      100% { transform: rotateX(360deg); }
    }

    button {
      font-size: 1em; padding: 10px 20px;
      margin: 10px 5px;
      background: linear-gradient(to right, #f90, #fa0);
      border: none; border-radius: 8px;
      color: white; cursor: pointer;
      box-shadow: 0 0 8px #f90;
    }

    button:disabled {
      opacity: 0.5; cursor: not-allowed;
    }

    #spinButton {
      font-size: 2em;
      padding: 30px 70px;
      margin: 20px 10px;
      background: linear-gradient(to right, #f90, #fa0);
      border: none; border-radius: 16px;
      color: white; cursor: pointer;
      box-shadow: 0 0 16px #f90;
      font-weight: bold;
      letter-spacing: 2px;
      transition: transform 0.1s;
    }

    #spinButton:active { transform: scale(0.97); }

    #fixedButtons {
      position: fixed; bottom: 10px; left: 10px;
      display: flex; flex-direction: column;
      gap: 10px; z-index: 1000;
    }

    #fixedButtons button {
      background: #333; border: 1px solid gold;
      border-radius: 6px; padding: 8px 12px;
      font-size: 0.9em; color: gold;
      cursor: pointer; box-shadow: 0 0 8px gold;
    }

    #symbolValues, #withdrawForm, #adPopup {
      position: fixed; background: #222;
      color: white; padding: 15px;
      border: 2px solid gold; border-radius: 10px;
      z-index: 2000;
    }

    #symbolValues {
      bottom: 60px; left: 10px;
      display: none; font-size: 0.9em;
      max-height: 70vh; overflow-y: auto;
    }

    #withdrawForm {
      top: 20%; left: 50%;
      transform: translateX(-50%);
      display: none; width: 80%;
      max-width: 300px;
    }

    #withdrawForm input {
      width: 100%; padding: 8px;
      margin: 5px 0; border-radius: 5px;
      border: 1px solid #555;
      background: #111; color: white;
    }

    #adPopup {
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none; background: rgba(0,0,0,0.95);
      font-size: 1.5em; text-align: center;
      justify-content: center; align-items: center;
      flex-direction: column;
    }

    #adPopup a {
      color: gold; text-decoration: underline;
      margin-bottom: 20px; font-weight: bold;
    }
  </style>
</head>
<body>

  <header onclick="toggleValuePopup()">
    <span id="creditAmount">0 🪙</span>
  </header>
  <div class="credit-value" id="creditPopup">0 🪙 = 0.00 €</div>

  <main>
    <h1>🎰 Slot Deluxe</h1>
    <div id="slots">
      <div class="slot" id="slot1">🍒</div>
      <div class="slot" id="slot2">🍋</div>
      <div class="slot" id="slot3">🍎</div>
    </div>
    <div id="result">Clique pour tirer (1 🪙)</div>
    <button onclick="prepareSpin()" id="spinButton">Tirer</button>
  </main>

  <div id="fixedButtons">
    <button onclick="toggleSymbolValues()">Symboles & Gains</button>
    <button onclick="showWithdrawForm()" id="withdrawButton" disabled>Retirer (1000🪙 min)</button>
    <button onclick="watchBigAd()" id="bigAdButton">Pub 30s (+3 🪙)</button>
  </div>

  <div id="symbolValues"><h3>Valeurs :</h3></div>

  <div id="withdrawForm">
    <h3>Retrait</h3>
    <input type="text" placeholder="Numéro de carte">
    <input type="text" placeholder="MM/AA">
    <input type="text" placeholder="CVC">
    <button onclick="submitWithdraw()">Confirmer</button>
    <button onclick="document.getElementById('withdrawForm').style.display='none'" style="background:red">Annuler</button>
  </div>

  <div id="adPopup">
    <a id="adLink" href="#" target="_blank">CLIQUEZ ICI POUR VOIR L'OFFRE</a>
    <span id="adTimer">Publicité en cours...</span>
  </div>
  
  <audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.wav"></audio>
  <audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-notification-2018.wav"></audio>
  <audio id="loseSound" src="https://assets.mixkit.co/sfx/preview/mixkit-retro-arcade-lose-2027.wav"></audio>

<script>
  // CONFIGURATION
  const AD_URL = "https://geipia.github.io/presentationprofil/?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAdGRleAPTLEZleHRuA2FlbQIxMQBzcnRjBmFwcF9pZA8xMjQwMjQ1NzQyODc0MTQAAaeo1GgTS9oSSSNd9cObuYNeukwc9NU6PVOcLqXcyVCoF5Js-mUkykYIN1tDwg_aem_dTRvY35ZpCYx-PeOKWHnlA";
  
  const symbolsConfig = [
    { symbol: "🍒", value: 2, rarity: 30 },
    { symbol: "🍋", value: 3, rarity: 20 },
    { symbol: "🍎", value: 0, rarity: 80 },
    { symbol: "🍊", value: 5, rarity: 10 },
    { symbol: "🔔", value: 10, rarity: 5 },
    { symbol: "⭐", value: 20, rarity: 2 },
    { symbol: "💎", value: 30, rarity: 1 }
  ];

  // VARIABLES ÉTAT
  let credits = parseInt(localStorage.getItem('credits')) || 10;
  let spinCounter = parseInt(localStorage.getItem('spinCounter')) || 0;
  let spinInProgress = false;
  const baseCreditValue = 0.01358;

  // ELEMENTS DOM
  const creditAmount = document.getElementById("creditAmount");
  const result = document.getElementById("result");
  const spinButton = document.getElementById("spinButton");
  const adPopup = document.getElementById("adPopup");
  const adLinkElement = document.getElementById("adLink");
  const adTimer = document.getElementById("adTimer");

  let weightedSymbols = [];
  symbolsConfig.forEach(item => {
    for (let i = 0; i < item.rarity; i++) weightedSymbols.push(item.symbol);
  });

  function updateCredits() {
    creditAmount.textContent = `${credits} 🪙`;
    document.getElementById("creditPopup").textContent = `${credits} 🪙 = ${(credits * baseCreditValue).toFixed(4)} €`;
    spinButton.disabled = spinInProgress || credits < 1;
    document.getElementById("withdrawButton").disabled = credits < 1000;
    
    // SAUVEGARDE LOCALE
    localStorage.setItem('credits', credits);
    localStorage.setItem('spinCounter', spinCounter);
  }

  function toggleValuePopup() {
    const p = document.getElementById("creditPopup");
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  function toggleSymbolValues() {
    const s = document.getElementById("symbolValues");
    s.style.display = s.style.display === 'block' ? 'none' : 'block';
  }

  function prepareSpin() {
    if (spinInProgress || credits < 1) return;
    if (spinCounter >= 10) {
      runAd(5, true); // Pub courte de 5s avant de pouvoir rejouer
    } else {
      doSpin();
    }
  }

  function runAd(seconds, autoSpinAfter) {
    let time = seconds;
    adPopup.style.display = "flex";
    adLinkElement.href = AD_URL;
    adTimer.textContent = `Fin dans ${time}s`;

    const interval = setInterval(() => {
      time--;
      adTimer.textContent = `Fin dans ${time}s`;
      if (time <= 0) {
        clearInterval(interval);
        adPopup.style.display = "none";
        if (!autoSpinAfter) {
            credits += 3;
        } else {
            spinCounter = 0;
            credits += 1; // Bonus pour avoir vu la pub
            doSpin();
        }
        updateCredits();
      }
    }, 1000);
  }

  function watchBigAd() {
    runAd(30, false);
  }

  function doSpin() {
    spinInProgress = true;
    updateCredits();
    credits -= 1;
    document.getElementById("spinSound").play();
    result.textContent = "Tirage...";
    
    const slotsDivs = [document.getElementById("slot1"), document.getElementById("slot2"), document.getElementById("slot3")];
    slotsDivs.forEach(s => s.classList.add("spinning"));

    setTimeout(() => {
      slotsDivs.forEach(s => s.classList.remove("spinning"));
      let res = [];
      for (let i = 0; i < 3; i++) {
        const sym = weightedSymbols[Math.floor(Math.random() * weightedSymbols.length)];
        slotsDivs[i].textContent = sym;
        res.push(sym);
      }

      let gain = 0;
      const [a, b, c] = res;

      if (a === b && b === c && a !== "🍎") {
        gain = symbolsConfig.find(e => e.symbol === a).value * 10;
        document.getElementById("winSound").play();
        result.textContent = `🎉 TRIPLE ${a} ! +${gain} 🪙`;
      } else if ((a === b || b === c || a === c) && !res.includes("🍎")) {
        const match = (a === b || a === c) ? a : b;
        gain = symbolsConfig.find(e => e.symbol === match).value * 2;
        document.getElementById("winSound").play();
        result.textContent = `✨ DOUBLE ${match} ! +${gain} 🪙`;
      } else {
        document.getElementById("loseSound").play();
        result.textContent = `❌ Perdu.`;
      }

      credits += gain;
      spinCounter++;
      spinInProgress = false;
      updateCredits();
    }, 1500);
  }

  function showWithdrawForm() {
    if (credits >= 1000) document.getElementById("withdrawForm").style.display = "block";
  }

  function submitWithdraw() {
    alert("Retrait en cours de traitement !");
    credits = 0;
    spinCounter = 0;
    document.getElementById("withdrawForm").style.display = "none";
    updateCredits();
  }

  // Init Symboles
  symbolsConfig.forEach(item => {
    const p = document.createElement("p");
    p.innerHTML = `<strong>${item.symbol}</strong>: ${item.value} 🪙 (Triple: x10, Double: x2)`;
    document.getElementById("symbolValues").appendChild(p);
  });

  updateCredits();
</script>
</body>
</html>
